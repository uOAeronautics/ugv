[project]
name = "ugv"
version = "0.1.0"
description = "Bounded diagnostics for a Freenove FNK0043 Raspberry Pi car"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116",
    "onnxruntime>=1.20",
    "opencv-contrib-python-headless>=4.13",
    "pyserial>=3.5",
    "rpi-ws281x>=5.0; sys_platform == 'linux'",
    "smbus2>=0.5",
    "spidev>=3.8; sys_platform == 'linux'",
    "uvicorn>=0.35",
    "websockets>=15",
]

[project.scripts]
ugv = "ugv:main"
ugv-dashboard = "ugv.web:main"
ugv-lab = "ugv.lab.server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests", "simulation/gazebo"]  # rl/ has its own CUDA env + tests; root stays torch-free

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "arduino",
    "**/static/vendor",
    "simulation/gazebo/lockstep/build",
    "runs",
    "rl/runs",
    ".venv",
    "rl/.venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts in these directories insert sibling paths into sys.path before local imports.
"simulation/gazebo/*.py" = ["E402"]
"tools/calibration/*.py" = ["E402"]
