[project]
name = "ugv-rl"
version = "0.1.0"
description = "GPU training for UGV drone-parking policy; Pi stays torch-free"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.10",
    "gymnasium>=0.29",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]
