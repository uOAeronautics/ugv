<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UGV Lab</title>
  <link rel="preload" href="/static/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23121211%22/%3E%3Cpath d=%22M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3%22 stroke=%22%23ff6a2b%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem('ugv-lab-theme'); if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }
    document.documentElement.dataset.mode = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
  </script>
</head>
<body>
  <header class="bar">
    <a class="mark" href="#park" aria-label="UGV Lab, park"><b>UGV LAB</b><span>STRL-001<br>BELLY PARK</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#park" data-page="park"><kbd>1</kbd><span>Park</span></a>
      <a href="#challenge" data-page="challenge"><kbd>2</kbd><span>Challenge</span></a>
      <a href="#pose" data-page="pose"><kbd>3</kbd><span>Pose</span></a>
      <a href="#ledger" data-page="ledger"><kbd>4</kbd><span>Ledger</span></a>
      <i class="rail-ind" aria-hidden="true"></i>
    </nav>
    <div class="status">
      <span class="sim" title="The lab reads runs/ and research/ and runs simulations. It never connects to the car.">SIMULATION · NO LINK TO THE CAR</span>
      <button class="switch" id="theme" type="button" aria-label="Switch between night and day theme"><span>NIGHT</span><span>DAY</span></button>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
