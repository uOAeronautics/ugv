<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UGV Lab</title>
  <link rel="preload" href="/static/fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/nunito-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23121211%22/%3E%3Cpath d=%22M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3%22 stroke=%22%23ff6a2b%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem('ugv-lab-theme'); if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }
    document.documentElement.dataset.mode = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
  </script>
</head>
<body>
  <header class="bar">
    <a class="mark" href="#park" aria-label="UGV Lab, park"><b>UGV Lab</b></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#park" data-page="park"><kbd>1</kbd><span>Park</span></a>
      <a href="#challenge" data-page="challenge"><kbd>2</kbd><span>Challenge</span></a>
      <a href="#pose" data-page="pose"><kbd>3</kbd><span>Pose</span></a>
      <a href="#ledger" data-page="ledger"><kbd>4</kbd><span>Ledger</span></a>
      <i class="rail-ind" aria-hidden="true"></i>
    </nav>
    <div class="status">
      <span class="sim" title="The lab reads runs/ and research/ and runs simulations. It never connects to the car.">Simulation only</span>
      <button class="switch" id="theme" type="button" aria-label="Switch between night and day theme"><span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10.5 2.2a6 6 0 1 0 3.3 8.9A5 5 0 0 1 10.5 2.2Z" fill="currentColor"/></svg></span><span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></g></svg></span></button>
    </div>
  </header>
  <main id="page" tabindex="-1"></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
