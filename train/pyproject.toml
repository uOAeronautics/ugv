[project]
name = "ugv-train"
version = "0.1.0"
description = "GPU training for the ugv pose detector. Separate from the torch-free Pi package."
requires-python = ">=3.13"
dependencies = [
    "ugv",
    "torch>=2.11",
    "torchvision",
    "numpy",
    "opencv-contrib-python-headless>=4.13",
    "onnx",
    "onnxruntime",
]

[tool.uv]
package = false

[tool.uv.sources]
ugv = { path = "..", editable = true }
